      - CORE_PEER_CHAINCODEADDRESS=peer0.pharmacy.healthscore.com:9052
      - CORE_PEER_CHAINCODELISTENADDRESS=0.0.0.0:9052
      - CORE_PEER_GOSSIP_BOOTSTRAP=peer0.pharmacy.healthscore.com:9051
      - CORE_PEER_GOSSIP_EXTERNALENDPOINT=peer0.pharmacy.healthscore.com:9051
      - CORE_PEER_LOCALMSPID=PharmacyOrgMSP
      - CORE_PEER_MSPCONFIGPATH=/etc/hyperledger/fabric/msp
      - CORE_OPERATIONS_LISTENADDRESS=peer0.pharmacy.healthscore.com:9446
      - CORE_METRICS_PROVIDER=prometheus
      - CORE_CHAINCODE_EXECUTETIMEOUT=300s
    volumes:
      - ../organizations/peerOrganizations/pharmacy.healthscore.com/peers/peer0.pharmacy.healthscore.com:/etc/hyperledger/fabric
      - peer0.pharmacy.healthscore.com:/var/hyperledger/production
      - ../peercfg:/etc/hyperledger/peercfg
      - /var/run/docker.sock:/host/var/run/docker.sock
    working_dir: /root

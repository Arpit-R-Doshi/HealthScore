      - CORE_PEER_CHAINCODEADDRESS=peer0.lab.healthscore.com:10052
      - CORE_PEER_CHAINCODELISTENADDRESS=0.0.0.0:10052
      - CORE_PEER_GOSSIP_BOOTSTRAP=peer0.lab.healthscore.com:10051
      - CORE_PEER_GOSSIP_EXTERNALENDPOINT=peer0.lab.healthscore.com:10051
      - CORE_PEER_LOCALMSPID=LabOrgMSP

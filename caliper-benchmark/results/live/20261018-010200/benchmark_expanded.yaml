test:
  name: healthscore-network-benchmark
  description: Comprehensive benchmarking of the HealthScore Fabric network throughput, latency, saturation, and query scalability.
  workers:
    number: 5
  rounds:
    # ── Write Scalability Sweep (createPatientRecord) ──────────────────────────
    - label: createPatientRecord-50-tps
      description: Create patient records at low offered rate (50 TPS).
      txNumber: 500
      rateControl:
        type: fixed-rate
        opts:
          tps: 50
      workload:
        module: workload.js
        arguments:
          chaincodeId: healthscore
          targetFunction: createPatientRecord
          invokerIdentity: HospitalOrgAdmin

    - label: createPatientRecord-100-tps
      description: Create patient records at moderate offered rate (100 TPS).
      txNumber: 1000
      rateControl:
        type: fixed-rate
        opts:
          tps: 100
      workload:
        module: workload.js
        arguments:
          chaincodeId: healthscore
          targetFunction: createPatientRecord
          invokerIdentity: HospitalOrgAdmin

    - label: createPatientRecord-200-tps
      description: Create patient records at standard production operating rate (200 TPS).
      txNumber: 2000
      rateControl:
        type: fixed-rate
        opts:
          tps: 200
      workload:
        module: workload.js
        arguments:
          chaincodeId: healthscore
          targetFunction: createPatientRecord
          invokerIdentity: HospitalOrgAdmin

    - label: createPatientRecord-350-tps
      description: Create patient records near saturation knee boundary (350 TPS).
      txNumber: 3500
      rateControl:
        type: fixed-rate
        opts:
          tps: 350
      workload:
        module: workload.js
        arguments:
          chaincodeId: healthscore
          targetFunction: createPatientRecord
          invokerIdentity: HospitalOrgAdmin

    - label: createPatientRecord-1000-tps
      description: Stress test write capacity under severe over-saturation load (1000 TPS).
      txNumber: 10000
      rateControl:
        type: fixed-rate
        opts:
          tps: 1000
      workload:
        module: workload.js
        arguments:
          chaincodeId: healthscore
          targetFunction: createPatientRecord
          invokerIdentity: HospitalOrgAdmin

    # ── Multi-Function Write Invariance at 200 TPS ─────────────────────────────
    - label: updateHealthScore-200-tps
      description: Update health scores with state mutation and index update (200 TPS).
      txNumber: 2000
      rateControl:
        type: fixed-rate
        opts:
          tps: 200
      workload:
        module: workload.js
        arguments:
          chaincodeId: healthscore
          targetFunction: updateHealthScore
          invokerIdentity: HospitalOrgAdmin
          preSeedCount: 50

    - label: createPrescription-200-tps
      description: Create digital prescriptions on ledger (200 TPS).
      txNumber: 2000
      rateControl:
        type: fixed-rate
        opts:
          tps: 200
      workload:
        module: workload.js
        arguments:
          chaincodeId: healthscore
          targetFunction: createPrescription
          invokerIdentity: HospitalOrgAdmin

    - label: requestScan-200-tps
      description: Request diagnostic scans on ledger (200 TPS).
      txNumber: 2000
      rateControl:
        type: fixed-rate
        opts:
          tps: 200
      workload:
        module: workload.js
        arguments:
          chaincodeId: healthscore
          targetFunction: requestScan
          invokerIdentity: HospitalOrgAdmin

    # ── Read Query Scalability Sweep (getPatientRecord) ───────────────────────
    - label: getPatientRecord-100-tps
      description: Baseline query throughput at low read load (100 TPS).
      txNumber: 1000
      rateControl:
        type: fixed-rate
        opts:
          tps: 100
      workload:
        module: workload.js
        arguments:
          chaincodeId: healthscore
          targetFunction: getPatientRecord
          invokerIdentity: HospitalOrgAdmin
          preSeedCount: 50

    - label: getPatientRecord-250-tps
      description: Intermediate query throughput at medium read load (250 TPS).
      txNumber: 2500
      rateControl:
        type: fixed-rate
        opts:
          tps: 250
      workload:
        module: workload.js
        arguments:
          chaincodeId: healthscore
          targetFunction: getPatientRecord
          invokerIdentity: HospitalOrgAdmin
          preSeedCount: 50

    - label: getPatientRecord-500-tps
      description: High-throughput local peer state query without consensus overhead (500 TPS).
      txNumber: 5000
      rateControl:
        type: fixed-rate
        opts:
          tps: 500
      workload:
        module: workload.js
        arguments:
          chaincodeId: healthscore
          targetFunction: getPatientRecord
          invokerIdentity: HospitalOrgAdmin
          preSeedCount: 50
